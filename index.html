  return t}
function push(t){
  var ts=M.mod||Date.now();
  return api("/rest/v1/dados?on_conflict=user_id",{m:"POST",tok:t,h:{Prefer:"resolution=merge-duplicates,return=minimal"},b:{user_id:M.s.u,conteudo:D,atualizado_em:new Date(ts).toISOString()}}).then(function(){M.sy=ts})}
function sync(manual){
  if(!M.s)return Promise.resolve();
  if(busy)return Promise.resolve();
  if(!navigator.onLine){if(manual)msg("Sem internet. Seus dados continuam salvos neste aparelho.");return Promise.resolve()}
  busy=true;if(manual)msg("Sincronizando...");
  return tok().then(function(t){
    return api("/rest/v1/dados?select=conteudo,atualizado_em&user_id=eq."+M.s.u,{tok:t}).then(function(rows){
      if(!Array.isArray(rows))throw new Error("Resposta inesperada do servidor.");
      var r=rows[0],sy=M.sy||0,lc=(M.mod||0)>sy;
      if(!r||!Array.isArray(r.conteudo))return lc||!r?push(t):0;
      var rt=Date.parse(r.atualizado_em)||0,rc=rt>sy;
      if(lc&&rc){D=merge(D,r.conteudo);M.mod=Date.now();store();saveM();return push(t).then(function(){render()})}
      if(rc){D=r.conteudo.filter(okItem);M.mod=rt;M.sy=rt;store();saveM();render();return}
      if(lc)return push(t);
    })}).then(function(){
      M.last=Date.now();saveM();
      var d=new Date(M.last);
      msg("Sincronizado em "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+" às "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+".")
    }).catch(function(e){msg(fmtErr(e))}).then(function(){busy=false})}
function auth(kind){
  var em=$("#sye").value.trim(),pw=$("#syp").value;
  if(!em||!pw){msg("Preencha e-mail e senha.");return}
  msg("Aguarde...");
  var p=kind==="up"?api("/auth/v1/signup",{m:"POST",b:{email:em,password:pw}}):api("/auth/v1/token?grant_type=password",{m:"POST",b:{email:em,password:pw}});
  p.then(function(j){
    if(!j||!j.access_token){msg("Conta criada. Confirme o e-mail que você recebeu e depois toque em Entrar.");return}
    setSess(j);rS();return sync(true)
  }).catch(function(e){msg(fmtErr(e))})}
function rS(){
  var e=$("#sy");if(!e)return;
  if(M.s){
    e.innerHTML='<div class="mh"><span>Sincronização</span><small>'+esc(M.s.e)+'</small></div><div class="note" id="sm"></div><div class="btns"><button id="sn">Sincronizar agora</button><button id="so">Sair</button></div>';
    $("#sn").onclick=function(){sync(true)};
    $("#so").onclick=function(){M.s=null;saveM();msg("Você saiu. Os dados continuam neste aparelho.");rS()};
  }else{
    e.innerHTML='<div class="mh"><span>Sincronizar entre aparelhos</span></div><div class="note">Entre com o mesmo e-mail e senha no Android e no iPhone para manter os dados iguais.</div><input id="sye" type="email" placeholder="E-mail" autocomplete="username"><input id="syp" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" style="margin-top:8px"><div class="err" id="sm"></div><div class="btns"><button id="si" class="ok">Entrar</button><button id="sc">Criar conta</button></div>';
    $("#si").onclick=function(){auth("in")};
    $("#sc").onclick=function(){auth("up")};
  }
  msg(SM)}
window.addEventListener("online",function(){sync()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});

render();
sync();
if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script></body></html>
